<!doctype html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/admin}"
>
<head>
    <title>Admin - Quan ly Rut tien</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-cash-stack me-2"></i>Quan ly Rut tien</h2>
        <div class="d-flex gap-2">
            <a href="/api/wallet/withdraw/export"
               class="btn btn-success"
               onclick="setTimeout(() => location.reload(), 2000)">
                <i class="bi bi-download me-1"></i>Xuat file
            </a>
            <a href="/admin/disputes" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success fade-in">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger fade-in">
        <i class="bi bi-x-circle me-2"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Ma GD</th>
                        <th>Nguoi dung</th>
                        <th>So tien</th>
                        <th>Ngan hang</th>
                        <th>So tai khoan</th>
                        <th>Ten chu TK</th>
                        <th>Trang thai</th>
                        <th>Thoi gian</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(withdrawals)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-inbox display-6"></i>
                            <p class="mb-0 mt-2">Chua co yeu cau rut tien nao</p>
                        </td>
                    </tr>
                    <tr th:each="w : ${withdrawals}"
                        th:classappend="${w.status == 'PENDING' ? 'table-warning' : ''}">
                        <td><code th:text="'#' + ${w.id}"></code></td>
                        <td th:text="${w.user.username}"></td>
                        <td class="fw-bold text-danger"
                            th:text="${#numbers.formatDecimal(w.amount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                        <td th:text="${w.bankName}"></td>
                        <td th:text="${w.bankAccount}"></td>
                        <td th:text="${w.accountName}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${w.status == 'PENDING' ? 'bg-warning' : (w.status == 'EXPORTED' ? 'bg-success' : 'bg-danger')}"
                                  th:text="${w.status == 'PENDING' ? 'PENDING' : 'EXPORTED'}">
                            </span>
                        </td>
                        <td th:text="${#temporals.format(w.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
