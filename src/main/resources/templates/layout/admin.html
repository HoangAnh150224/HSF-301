<!doctype html>
<html
        lang="vi"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Digital Market</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link th:href="@{/css/style.css}" rel="stylesheet" />

</head>
<body>
<!-- Admin Navbar -->
<nav class="navbar navbar-expand-lg fixed-top admin-navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/disputes}">
      <i class="bi bi-shield-fill-check me-2"></i>Digital Market
      <span class="admin-badge">ADMIN</span>
    </a>
    <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#adminNavbar"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminNavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/admin/disputes}">
            <i class="bi bi-shield-exclamation me-1"></i>Disputes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/api/wallet/withdraw/viewall}">
            <i class="bi bi-cash-stack me-1"></i>Quan ly Rut tien
          </a>
        </li>
      </ul>

      <ul class="navbar-nav">
        <li class="nav-item">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="nav-link btn-logout px-3">
              <i class="bi bi-box-arrow-right me-1"></i>Dang xuat
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Content -->
<main class="container py-4" style="padding-top: 100px !important;">
  <div layout:fragment="content">
    <!-- Content replaces this -->
  </div>
</main>

<!-- Footer -->
<footer class="admin-footer mt-auto">
  <div class="container text-center">
    <p class="mb-0">
      &copy; 2025 Digital Market <span class="admin-badge">ADMIN PANEL</span>
    </p>
  </div>
</footer>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<div layout:fragment="scripts">
  <!-- Scripts replace this -->
</div>
</body>
</html>
