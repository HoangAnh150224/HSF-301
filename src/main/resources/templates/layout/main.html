<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Market - Giao dịch tài nguyên số</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <a class="navbar-brand" th:href="@{/}">
          <i class="bi bi-globe2 me-2"></i>Digital Market
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/}"
                ><i class="bi bi-house me-1"></i>Trang chủ</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/products}"
                ><i class="bi bi-grid me-1"></i>Sản phẩm</a
              >
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <a class="nav-link" th:href="@{/products/create}"
                ><i class="bi bi-plus-circle me-1"></i>Đăng bán</a
              >
            </li>
          </ul>

          <ul class="navbar-nav">
            <!-- Authenticated User -->
            <li class="nav-item me-3" sec:authorize="isAuthenticated()">
              <a class="wallet-badge" th:href="@{/wallet}">
                <i class="bi bi-wallet2"></i>
                <span id="navBalance">0</span> VND
              </a>
            </li>

            <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle me-1"></i>
                <span sec:authentication="name">User</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" th:href="@{/transactions}"
                    ><i class="bi bi-clock-history me-2"></i>Lịch sử</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/my-products}"
                    ><i class="bi bi-box-seam me-2"></i>Sản phẩm của tôi</a
                  >
                </li>
                <li></li>
                <li>
                  <a class="dropdown-item" th:href="@{/wallet}"
                    ><i class="bi bi-wallet me-2"></i>Ví tiền</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="dropdown-item text-danger">
                      <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                    </button>
                  </form>
                </li>
              </ul>
            </li>

            <!-- Not Authenticated -->
            <li class="nav-item" sec:authorize="!isAuthenticated()">
              <a class="nav-link" th:href="@{/login}"
                ><i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập</a
              >
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
              <a class="btn btn-primary btn-sm ms-2" th:href="@{/register}"
                >Đăng ký</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Page Content -->
    <main class="container py-4">
      <div layout:fragment="content">
        <!-- Content replaces this -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto">
      <div class="container text-center">
        <p class="mb-0">
          &copy; 2025 Digital Market. Hệ thống giao dịch tài nguyên số an toàn.
        </p>
      </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>

    <div layout:fragment="scripts">
      <!-- Scripts replace this -->
    </div>
  </body>
</html>
