<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/main}"
>
  <head>
    <title>Sản phẩm - Digital Market</title>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-grid me-2"></i>Sản phẩm</h2>
        <a th:href="@{/products/create}" class="btn btn-primary">
          <i class="bi bi-plus-lg me-2"></i>Đăng bán
        </a>
      </div>

      <!-- Filters -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Tìm kiếm</label>
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Nhập từ khóa..."
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Giá từ</label>
              <input
                type="number"
                id="priceFrom"
                class="form-control"
                placeholder="0"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Giá đến</label>
              <input
                type="number"
                id="priceTo"
                class="form-control"
                placeholder="999999"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Sắp xếp</label>
              <select id="sortBy" class="form-select">
                <option value="newest">Mới nhất</option>
                <option value="price_asc">Giá tăng dần</option>
                <option value="price_desc">Giá giảm dần</option>
              </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button
                class="btn btn-outline-primary w-100"
                onclick="filterProducts()"
              >
                <i class="bi bi-funnel me-1"></i>Lọc
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div id="productGrid" class="row g-4">
        <!-- Products loaded via AJAX -->
      </div>

      <!-- Pagination -->
      <nav class="mt-4" id="pagination">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <select
              id="pageSize"
              class="form-select form-select-sm"
              style="width: auto"
              onchange="loadProducts()"
            >
              <option value="5">5 / trang</option>
              <option value="10" selected>10 / trang</option>
              <option value="15">15 / trang</option>
              <option value="20">20 / trang</option>
            </select>
          </div>
          <ul class="pagination mb-0" id="paginationLinks">
            <!-- Pagination links -->
          </ul>
        </div>
      </nav>

      <!-- Empty State -->
      <div id="emptyState" class="text-center py-5" style="display: none">
        <i class="bi bi-inbox display-1 text-muted"></i>
        <h4 class="mt-3">Chưa có sản phẩm nào</h4>
        <p class="text-muted">Hãy là người đầu tiên đăng bán!</p>
        <a th:href="@{/products/create}" class="btn btn-primary"
          >Đăng sản phẩm</a
        >
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Đang tải...</p>
      </div>
    </div>

    <div layout:fragment="scripts">
      <script>
        let currentPage = 0;

        $(document).ready(function () {
          loadProducts();
        });

        function loadProducts() {
          $("#loadingState").show();
          $("#productGrid").hide();
          $("#emptyState").hide();

          const pageSize = $("#pageSize").val() || 10;
          $.get("/api/products", function (products) {
            $("#loadingState").hide();

            if (!products || products.length === 0) {
              $("#productGrid").hide();
              $("#pagination").hide();
              $("#emptyState").show();
              return;
            }

            $("#emptyState").hide();
            $("#productGrid").show();

            let html = "";
            products.forEach(function (p) {
              const statusBadge =
                p.status === "ACTIVE"
                  ? '<span class="badge bg-success">Đang bán</span>'
                  : '<span class="badge bg-secondary">' + p.status + "</span>";

              const feeText =
                p.feeBearer === "BUYER" ? "Buyer pays fee" : "Seller pays fee";
              const description = (p.description || "").substring(0, 80);
              const price =
                typeof p.price === "object"
                  ? parseFloat(p.price)
                  : parseFloat(p.price);

              html += `
                            <div class="col-md-4 col-lg-3">
                                <div class="card product-card h-100" onclick="window.location='/products/${p.intermediaryCode || p.id}'">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between mb-2">
                                            ${statusBadge}
                                            <small class="text-muted">#${p.intermediaryCode || p.id}</small>
                                        </div>
                                        <h5 class="card-title">${p.topic}</h5>
                                        <p class="card-text text-muted small">${description}...</p>
                                    </div>
                                    <div class="card-footer">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="price-display">${formatVND(price)} <small>VND</small></span>
                                            <small class="text-muted">${feeText}</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
            });
            $("#productGrid").html(html);
          }).fail(function () {
            $("#loadingState").hide();
            showToast("Không thể tải danh sách sản phẩm", "error");
          });
        }

        function filterProducts() {
          loadProducts();
        }
      </script>
    </div>
  </body>
</html>
