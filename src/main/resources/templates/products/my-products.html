<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/main}"
>
  <head>
    <title>Sản phẩm của tôi - Digital Market</title>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">
          <i class="bi bi-person-lines-fill me-2"></i>Sản phẩm của tôi
        </h2>
        <a th:href="@{/products/create}" class="btn btn-primary">
          <i class="bi bi-plus-lg me-2"></i>Đăng bán mới
        </a>
      </div>

      <!-- Products Grid -->
      <div id="productGrid" class="row g-4">
        <!-- Products loaded via AJAX -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="text-center py-5" style="display: none">
        <i class="bi bi-inbox display-1 text-muted"></i>
        <h4 class="mt-3">Bạn chưa đăng bán sản phẩm nào</h4>
        <a th:href="@{/products/create}" class="btn btn-primary mt-2"
          >Đăng bán ngay</a
        >
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Đang tải...</p>
      </div>
    </div>

    <div layout:fragment="scripts">
      <script>
        $(document).ready(function () {
          loadMyProducts();
        });

        function loadMyProducts() {
          $("#loadingState").show();
          $("#productGrid").hide();
          $("#emptyState").hide();

          $.get("/api/products/me", function (products) {
            $("#loadingState").hide();

            if (!products || products.length === 0) {
              $("#emptyState").show();
              return;
            }

            $("#productGrid").show();

            let html = "";
            products.forEach(function (p) {
              const statusBadge =
                p.status === "ACTIVE"
                  ? '<span class="badge bg-success">Đang bán</span>'
                  : '<span class="badge bg-secondary">' + p.status + "</span>";

              const visibilityBadge =
                p.visibility === "PRIVATE"
                  ? '<span class="badge bg-warning text-dark ms-1"><i class="bi bi-lock-fill"></i> Riêng tư</span>'
                  : '<span class="badge bg-info text-dark ms-1"><i class="bi bi-globe"></i> Công khai</span>';

              const price =
                typeof p.price === "object"
                  ? parseFloat(p.price)
                  : parseFloat(p.price);

              html += `
                            <div class="col-md-4 col-lg-3">
                                <div class="card product-card h-100" onclick="window.location='/products/${p.id}'">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between mb-2">
                                            <div>${statusBadge}${visibilityBadge}</div>
                                            <small class="text-muted">#${p.intermediaryCode || p.id}</small>
                                        </div>
                                        <h5 class="card-title">${p.topic}</h5>
                                        <p class="card-text text-muted small">${(p.description || "").substring(0, 80)}...</p>
                                    </div>
                                    <div class="card-footer">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="price-display">${formatVND(price)} <small>VND</small></span>
                                            <a href="/products/${p.id}" class="btn btn-sm btn-outline-primary">Chi tiết</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
            });
            $("#productGrid").html(html);
          }).fail(function () {
            $("#loadingState").hide();
            showToast("Không thể tải danh sách sản phẩm", "error");
          });
        }
      </script>
    </div>
  </body>
</html>
